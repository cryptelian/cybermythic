_id: kC4u5DPvb06eO41n
name: Lancer de dés Anarchy
type: script
author: hpG0HqTpAMeCLTP9
img: icons/svg/dice-target.svg
scope: global
command: |-
  new Dialog({
    title: "Lancer de dés Anarchy",
    content: `<p>Donnez le nombre de dés à lancer</p>
    <input name="macro-roll-count-dice" type="number" value="3" />`,
    buttons: {
      cancel: { label: "Annuler", icon: '<i class="fas fa-times"></i>' },
      submit: {
        label: "Lancer", icon: '<i class="fas fa-dice"></i>',
        callback: async html => {
          const count = Number(html.find('input[name="macro-roll-count-dice"]').val());
          if (!game.system.anarchy.AnarchyRoll) {
            ui.notifications.error("AnarchyRoll class not exposed on system.");
            return;
          }
          // Use system roll logic
          const roll = new game.system.anarchy.AnarchyRoll({
            pool: count,
            target: 5
          });
          await roll.evaluate();
          
          // Use system reporting
          const flavor = `Lancer de ${count}d6`;
          await roll.toMessage({ flavor: flavor });
        }
      }
    }, default: "submit"
  }).render(true);
