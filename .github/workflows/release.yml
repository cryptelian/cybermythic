name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20.18.0
        uses: actions/setup-node@v4
        with:
          node-version: 20.18.0
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint and style checks
        run: |
          npm run lint
          npm run lint:css

      - name: Validate source metadata
        run: npm run validate

      - name: Build
        run: npm run build

      - name: Validate packaged dist
        run: npm run validate:dist

      - name: Run unit tests
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Visual regression tests
        run: npm run test:visual:ci

      - name: Collect metrics (no rebuild)
        run: npm run metrics:ci

      - name: Prepare release artifacts
        run: npm run release:prepare -- --repo ${{ github.repository }} --version ${{ github.ref_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .release/*.zip
            .release/system.json
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
