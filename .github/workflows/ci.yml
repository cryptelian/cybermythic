name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20.18.0
        uses: actions/setup-node@v4
        with:
          node-version: 20.18.0
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint and style checks
        run: |
          npm run lint
          npm run lint:css

      - name: Validate source metadata
        run: npm run validate

      - name: Build
        run: npm run build

      - name: Validate packaged dist
        run: npm run validate:dist

      - name: Run tests
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Visual regression tests
        run: npm run test:visual:ci

      - name: Collect metrics (no rebuild)
        run: npm run metrics:ci

      - name: Report bundle sizes
        run: |
          echo "build output sizes:" > sizes.txt
          du -h dist/* >> sizes.txt || true
          cat sizes.txt

      - name: Upload build output artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist

      - name: Upload metrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: metrics/baseline.json

      - name: Upload size report
        uses: actions/upload-artifact@v4
        with:
          name: sizes
          path: sizes.txt

      - name: Upload build stats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stats
          path: |
            docs/development/stats.html
