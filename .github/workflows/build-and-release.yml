name: Build, Zip and Release

on:
  push:
    tags:
      - 'v*.*.*' # Trigger the workflow on version tags

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
      packages: write
      pull-requests: write
      repository-projects: write

    steps:
      - name: Check out the code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build the packaged system
        run: npm run build

      - name: Validate packaged dist
        run: npm run validate:dist

      - name: Prepare release assets
        run: npm run release:prepare -- --version ${{ github.ref_name }}

      - name: Compute release asset name
        id: asset
        run: echo "zip_name=cybermythic-${GITHUB_REF_NAME#v}.zip" >> "$GITHUB_OUTPUT"

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./.release/${{ steps.asset.outputs.zip_name }}
          asset_name: ${{ steps.asset.outputs.zip_name }}
          asset_content_type: application/zip
